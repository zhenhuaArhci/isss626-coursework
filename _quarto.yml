project:
  type: website
  output-dir: _site
  execute-dir: project
  resources:
    - "/take home exercise1/data/metadata/**"
    - "/take home exercise1/R/*.R"
    - "!/take home exercise1/data/raw/**"
    - "!/take home exercise1/data/derived/**"
  render:
    - index.qmd
    - about.qmd
    - 404.qmd
    - hands-on-exercise-1a/index.qmd
    - hands-on-exercise-1b/index.qmd
    - handson2A/index.qmd
    - handson2B/index.qmd
    - handson4/index.qmd
    - inlcass4/index.qmd
    - "take home exercise1/index.qmd"
    - "take home exercise1/technical-report.qmd"
    - "take home exercise1/executive-summary.qmd"
    - "take home exercise1/learning-guide.qmd"

website:
  title: "ISSS626-GAA"
  navbar:
    background: "#dce7f3"
    foreground: "#4c5e7e"
    left:
      - text: "Hands-on Exercise"
        menu:
          - text: "Hands-on Exercise 1A"
            href: hands-on-exercise-1a/index.qmd
          - text: "Hands-on Exercise 1B"
            href: hands-on-exercise-1b/index.qmd
          - text: "Hands-on Exercise 2A"
            href: handson2A/index.qmd
          - text: "Hands-on Exercise 2B"
            href: handson2B/index.qmd
          - text: "Hands-on Exercise 4"
            href: handson4/index.qmd
      - text: "In-class Exercise"
        menu:
          - text: "inlcass4"
            href: inlcass4/index.qmd
      - text: "Take-home Exercise"
        menu:
          - text: "Exercise 1 · Thailand road accidents"
            href: "take home exercise1/index.qmd"
          - text: "Technical Report · draft"
            href: "take home exercise1/technical-report.qmd"
          - text: "Executive Summary · draft"
            href: "take home exercise1/executive-summary.qmd"
    right:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
  search:
    location: navbar
    type: overlay

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true

execute:
  freeze: auto
  warning: false
  message: false
